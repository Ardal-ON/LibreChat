# Override for local Semaa + Visual Paradigm MCP testing.
# Must live next to deploy-compose.yml so build context is this directory (not .../LibreChat/LibreChat).
#
#   docker compose -f deploy-compose.yml -f docker-compose.semaa-local.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.multi
      target: api-build
    image: librechat-semaa-api:local
    env_file:
      - .env
    environment:
      - SEMAA_AGENT_BASE_URL=http://semaa-agent:3333/v1
      - GRAPH_RAG_PORT=${GRAPH_RAG_PORT:-8001}
      - GRAPH_RAG_API_URL=http://graphrag_api:${GRAPH_RAG_PORT:-8001}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CREDS_KEY=${CREDS_KEY}
      - CREDS_IV=${CREDS_IV}
      - MCP_RELAY_SECRET=${MCP_RELAY_SECRET}
      - RELAY_HOST=relay.semaa.site
      - RELAY_PROTOCOL=wss
      - RELAY_PORT=443
      - VISUAL_PARADIGM_AGENT_ID=${VISUAL_PARADIGM_AGENT_ID:-agent_SemaaGRVP2026x}
      - VISUAL_PARADIGM_AGENT_NAMES=${VISUAL_PARADIGM_AGENT_NAMES:-SEMAA}
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
      - ./librechat.yaml:/app/librechat.yaml:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./logs:/app/api/logs
      - ./api/graphrag:/app/api/graphrag:ro
      - ./graphrag_data:/app/api/data/graphrag

  graphrag_api:
    image: librechat-semaa-api:local
    container_name: graphrag_api
    command: node /app/api/graphrag/server.js
    restart: always
    ports:
      - "${GRAPH_RAG_PORT:-8001}:${GRAPH_RAG_PORT:-8001}"
    env_file:
      - .env
    environment:
      - GRAPH_RAG_PORT=${GRAPH_RAG_PORT:-8001}
      - GRAPH_RAG_STORE_DIR=/app/api/data/graphrag
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./api/graphrag:/app/api/graphrag:ro
      - ./graphrag_data:/app/api/data/graphrag

  semaa-agent:
    build:
      context: ../../semaa-agent
      dockerfile: Dockerfile
    container_name: semaa-agent
    restart: always
    depends_on:
      - mongodb
      - graphrag_api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - MONGODB_URI=${SEMAA_MONGODB_URI:-mongodb://mongodb:27017}
      - MONGODB_DB_NAME=${SEMAA_MONGODB_DB_NAME:-SemaaAgent}
      - GRAPH_RAG_API_URL=http://graphrag_api:${GRAPH_RAG_PORT:-8001}
      - GRAPH_RAG_JWT_SECRET=${JWT_SECRET}
      - SEMAA_AGENT_SHARED_SECRET=${SEMAA_AGENT_SHARED_SECRET}
      - SEMAA_AGENT_API_KEY=${SEMAA_AGENT_API_KEY}
      - SEMAA_AGENT_ADMIN_API_KEY=${SEMAA_AGENT_ADMIN_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-5-mini}
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-openai}
      - CITATION_LINK_BASE_URL=${SEMAA_CITATION_LINK_BASE_URL:-http://localhost:3333}
    ports:
      - "${SEMAA_AGENT_PORT:-3333}:3333"
